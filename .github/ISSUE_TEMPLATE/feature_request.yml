name: Feature request
description: Suggest a new index, reader, analysis or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an enhancement. DroneBioR is research
        software for the academic and remote-sensing community - please
        describe the use case so we can design the feature with you.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        Describe the research workflow, decision, or data gap that the
        feature would address.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed design
      description: >
        Sketch the API (function name, arguments, return value) or the
        analysis you have in mind. Pseudocode is fine.
      render: r
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you tried.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: >
        DroneBioR wraps external photogrammetry engines (ODM, WebODM,
        Pix4Dmapper, Agisoft Metashape). It does not re-implement
        SfM/MVS/mesh/texture generation in R.
      options:
        - label: My request is within scope (scientific R layer, readers, analyses, examples, tests, docs).
          required: true
