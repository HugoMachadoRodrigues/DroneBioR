url: https://hugomachadorodrigues.github.io/DroneBioR/

template:
  bootstrap: 5
  bootswatch: cosmo

development:
  mode: auto

reference:
  - title: "Project setup"
    desc: >
      Build the project description used by the rest of the package,
      locate existing ODM projects, and configure PROJ on systems where
      terra or sf cannot find it.
    contents:
      - dronebio_project
      - detect_odm_projects
      - configure_proj_database

  - title: "External photogrammetry engines"
    desc: >
      Stage MicaSense images for ODM, drive ODM via Docker, and read
      products from ODM, WebODM, Pix4Dmapper and Agisoft Metashape.
    contents:
      - list_micasense_images
      - list_aerial_images
      - copy_images_for_odm
      - build_odm_args
      - build_point_cloud_only
      - default_max_concurrency
      - run_odm_project
      - refilter_odm_point_cloud
      - rebuild_from_edited_cloud
      - convert_undistorted_tiffs_for_texturing
      - odm_product_paths
      - summarize_odm_products
      - pick_best_point_cloud
      - pick_best_textured_obj
      - pick_best_textured_glb

  - title: "WebODM"
    desc: >
      Drive a WebODM server over its REST API instead of a local Docker
      container.
    contents:
      - as_webodm_options
      - webodm_authenticate
      - webodm_create_project
      - webodm_list_projects
      - webodm_submit_task
      - webodm_task_status
      - webodm_download_asset
      - run_webodm_project

  - title: "DJI Mavic 3M, PPK and camera geolocation"
    desc: >
      Reconstruct DJI Mavic 3M multispectral flights, and turn RTK/PPK
      logs and GeoScan metadata into the geolocation files ODM expects.
    contents:
      - run_odm_dji_mavic_3m
      - list_dji_mavic_3m_images
      - has_djim3m_images
      - detect_djim3m_ppk_files
      - inspect_djim3m_mrk
      - parse_djim3m_mrk
      - parse_djim3m_mrk_folder
      - write_djim3m_geo_txt
      - ppk_cli_rtklib_dji
      - detect_geoscan_metadata
      - read_geoscan_cameras
      - read_geoscan_gnss_offset
      - convert_geoscan_to_odm_geo

  - title: "Multispectral orthomosaic"
    desc: >
      Read and scale a multispectral orthomosaic, summarize layers and
      write DroneBioR raster products to disk.
    contents:
      - read_multispectral_orthomosaic
      - default_rgb_band_map
      - default_dji_mavic_3m_band_map
      - orthomosaic_band_presence
      - canonical_band_names
      - default_band_map_for_layers
      - scale_to_reflectance
      - summarize_spatraster
      - write_dronebio_rasters

  - title: "Vegetation indices and biomass proxy"
    contents:
      - compute_spectral_indices
      - compute_biomass_proxy
      - compute_biomass_proxies
      - export_all_covariates

  - title: "Classification"
    contents:
      - classify_ground_vegetation
      - classify_ground_csf
      - improve_dtm_csf

  - title: "Field data and baseline biomass model"
    contents:
      - read_field_data
      - extract_field_spectral_data
      - fit_biomass_lm

  - title: "Field sample ingest and windowed extraction"
    desc: >
      Load field points from a CSV or shapefile, pick the covariates
      built in the earlier tabs, and aggregate them over an n x n pixel
      window around each sample.
    contents:
      - stage_uploaded_vector
      - field_source_columns
      - read_field_points
      - prepare_field_table
      - field_covariate_catalogue
      - normalize_covariate_names
      - window_cells
      - extract_window_values
      - synthesize_pixel_raster
      - covariate_frame_from_pixels
      - extract_field_covariates

  - title: "caret field models"
    desc: >
      Train caret regression models with a shared 10-fold split, compare
      them, map the winner and save it as a runnable bundle.
    contents:
      - caret_model_catalogue
      - caret_model_available
      - field_train_split
      - fit_field_caret_model
      - field_model_metrics
      - format_field_metrics
      - predict.dronebio_field_model
      - build_prediction_stack
      - predict_field_model_map
      - export_field_biomass_map
      - biomass_map_breaks
      - classify_biomass_map
      - save_field_model_bundle
      - load_field_model_bundle
      - write_field_model_summary

  - title: "Field-calibrated biomass mapping"
    desc: >
      Calibrate against field samples or a rising-plate meter, then
      predict a biomass surface over the flight.
    contents:
      - fit_plate_meter
      - predict.dronebio_plate_meter
      - build_biomass_calibration
      - fit_biomass_model
      - make_biomass_grid
      - predict_biomass_map
      - run_biomass_mapping

  - title: "Point clouds and CHM"
    desc: >
      Read dense point clouds, build a canopy height model from
      DSM/DTM and attach heights to selected points.
    contents:
      - read_full_point_cloud
      - read_las_point_cloud
      - read_ply_point_cloud
      - parse_ply_header
      - write_ply_subset
      - despike_point_cloud
      - despike_ply
      - build_chm_from_dsm_dtm
      - build_chm_raster
      - despike_dem
      - harmonize_dem_products
      - add_chm_heights
      - add_point_heights
      - compute_chm_roi_metrics

  - title: "Region of interest and selection metrics"
    contents:
      - build_roi_polygon
      - points_in_roi
      - filter_points_by_roi
      - compute_selection_metrics
      - compute_vertical_profile
      - compute_survey_volumes
      - derive_tree_candidates
      - export_point_selection

  - title: "Reports"
    contents:
      - render_dronebio_report

  - title: "Time series across flights"
    contents:
      - default_flight_registry
      - register_flight
      - list_flights
      - flight_time_series
      - flight_summary_helpers

  - title: "Workflow and outputs"
    desc: >
      Run the whole pipeline, collect the products into one documented
      folder, and check what actually landed on disk.
    contents:
      - run_dronebio_workflow
      - finalize_dronebio_products
      - validate_odm_outputs
      - quick_outputs_check
      - is_cloud_sync_path

  - title: "Web application"
    contents:
      - run_drone_biomass_studio
      - with_error_toast
      - observer_need

articles:
  - title: "Getting started"
    navbar: ~
    contents:
      - dronebior-overview

  - title: "Topics"
    navbar: ~
    contents:
      - external-engines
      - spectral-indices
      - point-clouds-and-chm
      - app-reference
